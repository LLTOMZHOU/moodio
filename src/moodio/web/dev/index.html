<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>moodio dev console</title>
  <style>
    :root {
      --bg: #0e0e10;
      --surface: #18181b;
      --border: #2a2a2e;
      --text: #e4e4e7;
      --dim: #71717a;
      --accent-agent: #c084fc;
      --accent-tts: #facc15;
      --accent-station: #4ade80;
      --accent-queue: #60a5fa;
      --accent-music: #22d3ee;
      --accent-provider: #f87171;
      --accent-fav: #818cf8;
      --mono: 'SF Mono', 'Menlo', 'Consolas', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--mono);
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    header h1 { font-size: 14px; font-weight: 600; }
    .status { color: var(--dim); font-size: 12px; }
    .status.connected { color: var(--accent-station); }
    .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .controls label { color: var(--dim); font-size: 11px; }
    .controls input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 12px;
      width: 180px;
    }
    .controls button {
      background: var(--border);
      border: none;
      color: var(--text);
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--mono);
      font-size: 12px;
    }
    .controls button:hover { background: #3a3a3e; }
    .controls button.active { background: var(--accent-agent); color: #000; }
    .stats {
      display: flex;
      gap: 12px;
      padding: 6px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      font-size: 11px;
      color: var(--dim);
      flex-shrink: 0;
    }
    .stats span { white-space: nowrap; }
    .stats .val { color: var(--text); }
    #events {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .event-row {
      display: grid;
      grid-template-columns: 72px 200px 80px 1fr;
      gap: 8px;
      padding: 3px 16px;
      border-bottom: 1px solid transparent;
    }
    .event-row:hover { background: var(--surface); border-bottom-color: var(--border); }
    .event-row .ts { color: var(--dim); }
    .event-row .name { font-weight: 500; }
    .event-row .trace { color: var(--dim); font-size: 11px; }
    .event-row .summary { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-row.expanded .summary { white-space: normal; }
    .event-detail {
      display: none;
      padding: 8px 16px 8px 296px;
      color: var(--dim);
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }
    .event-row.expanded + .event-detail { display: block; }
    .event-detail pre { white-space: pre-wrap; word-break: break-all; color: var(--text); }
    .name[data-cat="agent"] { color: var(--accent-agent); }
    .name[data-cat="tts"] { color: var(--accent-tts); }
    .name[data-cat="station"] { color: var(--accent-station); }
    .name[data-cat="queue"] { color: var(--accent-queue); }
    .name[data-cat="music"] { color: var(--accent-music); }
    .name[data-cat="provider"] { color: var(--accent-provider); }
    .name[data-cat="favorites"] { color: var(--accent-fav); }
    .empty { text-align: center; padding: 40px; color: var(--dim); }
  </style>
</head>
<body>
  <header>
    <h1>moodio dev console</h1>
    <span id="ws-status" class="status">connecting...</span>
    <div class="controls">
      <label>filter</label>
      <input type="text" id="filter" placeholder="tts, agent, error..." />
      <button id="pause-btn">pause</button>
      <button id="clear-btn">clear</button>
    </div>
  </header>
  <div class="stats">
    <span>events: <span class="val" id="stat-total">0</span></span>
    <span>traces: <span class="val" id="stat-traces">0</span></span>
    <span>errors: <span class="val" id="stat-errors">0</span></span>
    <span>last: <span class="val" id="stat-last">-</span></span>
  </div>
  <div id="events"><div class="empty">waiting for events...</div></div>

  <script>
    const wsUrl = `ws://${location.host}/api/stream`;
    let ws, paused = false, eventCount = 0, traceIds = new Set(), errorCount = 0;
    const container = document.getElementById('events');
    const filterInput = document.getElementById('filter');
    const pauseBtn = document.getElementById('pause-btn');
    const clearBtn = document.getElementById('clear-btn');
    const maxEvents = 500;

    function category(name) {
      if (name.startsWith('agent.')) return 'agent';
      if (name.startsWith('tts.')) return 'tts';
      if (name.startsWith('station.')) return 'station';
      if (name.startsWith('queue.')) return 'queue';
      if (name.startsWith('music.')) return 'music';
      if (name.startsWith('provider.')) return 'provider';
      if (name.startsWith('favorites.')) return 'favorites';
      return '';
    }

    function summarize(name, payload) {
      if (!payload) return '';
      if (name === 'agent.turn.started') return `mode=${payload.mode || '?'} input="${(payload.input || '').slice(0, 80)}"`;
      if (name === 'agent.turn.completed') return `output="${(payload.output || '').slice(0, 80)}"`;
      if (name === 'agent.turn.failed') return `${payload.error_type || 'error'}: ${payload.error || ''}`;
      if (name === 'tts.segment.started' || name === 'tts.segment.completed') return `"${(payload.text || '').slice(0, 60)}"`;
      if (name === 'tts.audio.ready') return payload.url || '';
      if (name === 'tts.audio.failed') return payload.message || '';
      if (name === 'station.state.updated') return `mode=${payload.mode || '?'} status=${payload.status || '?'} talk=${payload.talk_density || '?'}`;
      if (name === 'queue.updated') return `size=${(payload.queue || []).length}`;
      if (name === 'favorites.updated') return `${payload.track_id || '?'} favorited=${payload.favorited}`;
      if (name.startsWith('music.playback')) return `${payload.track_id || '?'} ${payload.position_seconds || '?'}/${payload.duration_seconds || '?'}`;
      try { return JSON.stringify(payload).slice(0, 120); } catch { return ''; }
    }

    function addEvent(event) {
      const name = event.event || '?';
      const cat = category(name);
      const filter = filterInput.value.toLowerCase().trim();
      if (filter && !name.includes(filter) && !summarize(name, event.payload).toLowerCase().includes(filter)) {
        return;
      }

      const ts = (event.timestamp || '').slice(11, 19);
      const trace = (event.trace_id || '').slice(0, 8);
      const summary = summarize(name, event.payload);

      eventCount++;
      if (event.trace_id) traceIds.add(event.trace_id);
      if (name.includes('failed') || name.includes('error')) errorCount++;

      const row = document.createElement('div');
      row.className = 'event-row';
      row.innerHTML = `<span class="ts">${ts}</span><span class="name" data-cat="${cat}">${name}</span><span class="trace">${trace}</span><span class="summary">${summary}</span>`;

      const detail = document.createElement('div');
      detail.className = 'event-detail';
      detail.innerHTML = `<pre>${JSON.stringify(event.payload, null, 2)}</pre>`;

      row.addEventListener('click', () => {
        row.classList.toggle('expanded');
      });

      // remove empty placeholder
      const empty = container.querySelector('.empty');
      if (empty) empty.remove();

      container.appendChild(row);
      container.appendChild(detail);

      // trim old events
      while (container.children.length > maxEvents * 2) {
        container.removeChild(container.firstChild);
        container.removeChild(container.firstChild);
      }

      if (!paused) {
        container.scrollTop = container.scrollHeight;
      }

      document.getElementById('stat-total').textContent = eventCount;
      document.getElementById('stat-traces').textContent = traceIds.size;
      document.getElementById('stat-errors').textContent = errorCount;
      document.getElementById('stat-last').textContent = ts || '-';
    }

    function connect() {
      ws = new WebSocket(wsUrl);
      ws.onopen = () => {
        document.getElementById('ws-status').textContent = 'connected';
        document.getElementById('ws-status').className = 'status connected';
      };
      ws.onclose = () => {
        document.getElementById('ws-status').textContent = 'disconnected';
        document.getElementById('ws-status').className = 'status';
        setTimeout(connect, 2000);
      };
      ws.onmessage = (msg) => {
        try { addEvent(JSON.parse(msg.data)); } catch {}
      };
    }

    pauseBtn.addEventListener('click', () => {
      paused = !paused;
      pauseBtn.textContent = paused ? 'resume' : 'pause';
      pauseBtn.classList.toggle('active', paused);
    });

    clearBtn.addEventListener('click', () => {
      container.innerHTML = '';
      eventCount = 0; traceIds.clear(); errorCount = 0;
      document.getElementById('stat-total').textContent = '0';
      document.getElementById('stat-traces').textContent = '0';
      document.getElementById('stat-errors').textContent = '0';
      document.getElementById('stat-last').textContent = '-';
    });

    filterInput.addEventListener('input', () => {
      // re-render is too expensive; filter applies to new events only
    });

    connect();
  </script>
</body>
</html>
